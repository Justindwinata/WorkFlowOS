<!DOCTYPE html>

<html lang="id"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Register - WorkFlowOS</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>

                        "tertiary-fixed": "#ffdbcd",
                        "on-tertiary-fixed-variant": "#7d2d00",

                        "outline": "#737686",
                        "surface-container-lowest": "#ffffff",
                        "surface-tint": "#0053db",

                    "borderRadius": {
                        "DEFAULT": "0.125rem",
                        "lg": "0.25rem",

                        "full": "0.75rem"
                    },
                    "spacing": {
                        "xs": "4px",
                        "margin-page": "24px",
                        "sm": "8px",
                        "xl": "32px",
                        "unit": "4px",
                        "lg": "24px",
                        "gutter": "16px",

                    "fontFamily": {

<style>
        body { font-family: 'Inter', sans-serif; }
    </style>

<body class="bg-background min-h-screen flex items-center justify-center p-md">
<div class="bg-surface-container-lowest border border-surface-variant rounded-xl w-full max-w-[480px] p-xl flex flex-col shadow-[0_4px_12px_rgba(0,0,0,0.02)]">
<!-- Header -->
<div class="mb-lg text-center">
<h1 class="font-display-md text-display-md text-primary mb-xs">WorkFlowOS</h1>
<h2 class="font-section-title text-section-title text-on-surface mb-xs">Register</h2>
<p class="font-body-sm text-body-sm text-on-surface-variant">Lengkapi data di bawah ini untuk membuat akun baru.</p>
</div>
<!-- Form -->
<form class="flex flex-col gap-md">
<div class="flex flex-col gap-xs">
<label class="font-metadata text-metadata text-on-surface-variant" for="fullName">Nama Lengkap</label>
<input class="w-full h-10 px-sm border border-outline-variant rounded-lg bg-surface-container-lowest font-body-base text-body-base text-on-surface placeholder:text-outline focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-colors" id="fullName" placeholder="Masukkan nama lengkap" type="text"/>
</div>
<div class="flex flex-col gap-xs">
<label class="font-metadata text-metadata text-on-surface-variant" for="workEmail">Email Kerja</label>
<input class="w-full h-10 px-sm border border-outline-variant rounded-lg bg-surface-container-lowest font-body-base text-body-base text-on-surface placeholder:text-outline focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-colors" id="workEmail" placeholder="nama@perusahaan.com" type="email"/>
</div>
<div class="flex flex-col gap-xs">
<label class="font-metadata text-metadata text-on-surface-variant" for="workspaceName">Nama Workspace</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-sm top-1/2 -translate-y-1/2 text-outline-variant text-[20px]" style="font-variation-settings: 'FILL' 0;">domain</span>
<input class="w-full h-10 pl-[36px] pr-sm border border-outline-variant rounded-lg bg-surface-container-lowest font-body-base text-body-base text-on-surface placeholder:text-outline focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-colors" id="workspaceName" placeholder="Contoh: PT. Maju Bersama" type="text"/>
</div>
</div>
<div class="grid grid-cols-1 md:grid-cols-2 gap-md">
<div class="flex flex-col gap-xs">
<label class="font-metadata text-metadata text-on-surface-variant" for="password">Kata Sandi</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-sm top-1/2 -translate-y-1/2 text-outline-variant text-[20px]" style="font-variation-settings: 'FILL' 0;">lock</span>
<input class="w-full h-10 pl-[36px] pr-sm border border-outline-variant rounded-lg bg-surface-container-lowest font-body-base text-body-base text-on-surface placeholder:text-outline focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-colors" id="password" placeholder="••••••••" type="password"/>
</div>
</div>
<div class="flex flex-col gap-xs">
<label class="font-metadata text-metadata text-on-surface-variant" for="confirmPassword">Konfirmasi Kata Sandi</label>
<input class="w-full h-10 px-sm border border-outline-variant rounded-lg bg-surface-container-lowest font-body-base text-body-base text-on-surface placeholder:text-outline focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-colors" id="confirmPassword" placeholder="••••••••" type="password"/>
</div>
</div>
<div class="flex items-center gap-sm mt-xs">
<span class="material-symbols-outlined text-primary text-[16px]" style="font-variation-settings: 'FILL' 1;">verified_user</span>
<span class="font-metadata text-metadata text-on-surface-variant">Data Anda dienkripsi dan disimpan dengan aman.</span>
</div>
<button class="mt-sm w-full h-10 bg-primary hover:bg-primary-fixed-variant text-on-primary rounded-lg font-button-label text-button-label transition-colors flex items-center justify-center gap-sm" type="button">
                Sign Up
                <span class="material-symbols-outlined text-[18px]">arrow_forward</span>
</button>
</form>
<!-- Footer -->
<div class="mt-lg text-center pt-md border-t border-surface-variant">
<p class="font-body-sm text-body-sm text-on-surface-variant">
                Sudah memiliki akun? 
                <a class="text-primary hover:text-primary-fixed-variant font-medium transition-colors" href="#">Masuk di sini</a>
</p>
</div>
</div>
</body></html>
