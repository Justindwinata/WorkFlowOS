name: CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  lint-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: cd apps/api && npm run lint
      - run: cd apps/web && npx next lint
      - run: cd apps/web && npx tsc --noEmit
      - run: cd apps/api && npx tsc --noEmit

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: workflowos
          POSTGRES_PASSWORD: workflowos_dev
          POSTGRES_DB: workflowos
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U workflowos"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - name: Set up database
        env:
          DATABASE_URL: postgresql://workflowos:workflowos_dev@localhost:5432/workflowos
        run: |
          cd apps/api
          npx prisma generate
          npx prisma migrate deploy --skip-generate
          npm run seed
      - run: cd apps/api && npm run test -- --coverage --coverageReporters=text-lcov
      - run: cd apps/web && npm test -- --coverage
      - name: Upload API coverage
        uses: actions/upload-artifact@v4
        with:
          name: api-coverage
          path: apps/api/coverage/
      - name: Upload Web coverage
        uses: actions/upload-artifact@v4
        with:
          name: web-coverage
          path: apps/web/coverage/

  build:
    runs-on: ubuntu-latest
    needs: [lint-typecheck, test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: cd apps/api && npx prisma generate
      - run: cd apps/api && npm run build
      - run: cd apps/web && npm run build

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - name: Dependency audit
        run: npm audit --audit-level=high || true
      - name: Ensure no .env committed with real secrets
        run: |
          if git ls-files | grep -q '^\.env$\|/\.env$'; then
            echo "ERROR: .env file committed to repository"
            exit 1
          fi
          echo "No .env files committed"
      - name: Check for hardcoded secrets
        run: |
          if grep -r "password.*=.*["'\"]" --include="*.ts" --include="*.js" apps/ 2>/dev/null | grep -v ".spec.ts" | grep -v "hashed" | grep -v "test" | grep -v "REDACTED"; then
            echo "ERROR: Potential hardcoded password found"
            exit 1
          fi
          echo "No hardcoded secrets found"

  docker:
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - name: Verify docker-compose config
        run: docker compose -f docker-compose.prod.yml config
      - name: Validate API Dockerfile syntax
        run: test -f docker/api.Dockerfile && head -5 docker/api.Dockerfile || (echo "docker/api.Dockerfile not found"; exit 1)
      - name: Validate Web Dockerfile syntax
        run: test -f docker/web.Dockerfile && head -5 docker/web.Dockerfile || (echo "docker/web.Dockerfile not found"; exit 1)