name: Browser E2E

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: workflowos
          POSTGRES_PASSWORD: workflowos_dev
          POSTGRES_DB: workflowos
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U workflowos"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox webkit
        working-directory: apps/web

      - name: Set up database
        env:
          DATABASE_URL: postgresql://workflowos:workflowos_dev@localhost:5432/workflowos
        run: |
          cd apps/api
          npx prisma generate
          npx prisma migrate deploy
          npx prisma db push --force-reset
          npm run seed

      - name: Start API
        env:
          DATABASE_URL: postgresql://workflowos:workflowos_dev@localhost:5432/workflowos
          JWT_ACCESS_SECRET: test-access-secret
          JWT_REFRESH_SECRET: test-refresh-secret
          API_PORT: 3001
        run: |
          cd apps/api
          npm run start:dev &
          npx wait-on http://localhost:3001/health --timeout 60000

      - name: Run Playwright E2E
        env:
          DATABASE_URL: postgresql://workflowos:workflowos_dev@localhost:5432/workflowos
          NEXT_PUBLIC_API_URL: http://localhost:3001
        run: |
          cd apps/web
          npm run test:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7
