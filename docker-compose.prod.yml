version: '3.9'

services:
  postgres:
    image: postgres:15-alpine
    container_name: workflowos-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-workflowos}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-workflowos_dev}
      POSTGRES_DB: ${DB_NAME:-workflowos}
    ports:
      - '${DB_PORT:-5432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USER:-workflowos}']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - workflowos

  redis:
    image: redis:7-alpine
    container_name: workflowos-redis
    restart: unless-stopped
    ports:
      - '${REDIS_PORT:-6379}:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - workflowos

  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    container_name: workflowos-api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${DB_USER:-workflowos}:${DB_PASSWORD:-workflowos_dev}@postgres:5432/${DB_NAME:-workflowos}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      API_PORT: ${API_PORT:-3001}
      NODE_ENV: ${NODE_ENV:-production}
      WEB_URL: ${WEB_URL:-http://localhost:3000}
    ports:
      - '${API_PORT:-3001}:3001'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:3001/health']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - workflowos
    volumes:
      - /app/node_modules

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    container_name: workflowos-web
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3001}
      NODE_ENV: ${NODE_ENV:-production}
    ports:
      - '${WEB_PORT:-3000}:3000'
    depends_on:
      - api
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:3000/health']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - workflowos
    volumes:
      - /app/node_modules

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  workflowos:
    driver: bridge
